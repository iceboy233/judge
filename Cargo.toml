[workspace]
resolver = "2"

[package]
name = "judge"
edition = "2021"
default-run = "judge"

[dependencies]
anstyle = "1"
bpaf = { version = "0.9", features = ["bpaf_derive"] }
positioned-io = "0.3"
tempfile = "3"
zip = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
